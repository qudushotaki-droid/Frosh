<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asan Frosh</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c1a2e">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/icon-apple-touch.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asan Frosh">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#1c1a2e; --ink-2:#262341; --paper:#faf7ef; --paper-2:#f1e9d8;
    --accent:#c9922a; --accent-dim:#a3741e; --danger:#b3402f; --slate:#5c5a70; --slate-dim:#8b899f;
    --green:#2f9155; --amber:#d97706; --line:#e6dcc4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%; overflow-x:hidden; max-width:100vw;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--ink); color:var(--ink); overflow:hidden;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  #app{display:flex; height:100vh; height:-webkit-fill-available; height:100dvh; width:100vw;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    width:100vw; height:100vh; height:100dvh; background:var(--ink); display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:20px;
  }
  .login-card{background:var(--ink-2); border-radius:22px; padding:42px 36px; width:380px; max-width:92vw; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .login-card .brandmark{font-family:'JetBrains Mono',monospace; color:var(--paper); font-weight:700; letter-spacing:0.16em; font-size:14px; margin-bottom:10px;}
  .login-card h2{color:#fff; font-size:22px; margin:2px 0 28px; font-weight:700;}
  .login-card .field{text-align:left; margin-bottom:18px;}
  .login-card .field label{color:var(--slate-dim); font-size:11.5px;}
  .login-card .field input{
    width:100%; padding:15px 16px; border-radius:12px; border:1.5px solid #323a49;
    background:#20263340;
    font-size:16px; color:#fff;
  }
  .login-card .field input::placeholder{color:#6b7080;}
  .login-card .field input:focus{outline:none; border-color:var(--accent); background:#20263380;}
  .login-err{color:#ff8a75; font-size:12.5px; font-weight:600; margin:-6px 0 16px; text-align:left;}
  .login-card .login-submit{
    width:100%; margin-top:4px; padding:16px; font-size:15.5px; font-weight:700;
    border-radius:12px; background:var(--accent); color:var(--ink); border:none;
    letter-spacing:0.02em; transition:filter 0.15s ease;
  }
  .login-card .login-submit:hover{filter:brightness(1.08);}
  .login-card .login-submit:active{filter:brightness(0.94);}

  /* ---------- SIDEBAR / NAV ---------- */
  nav.side{width:84px; background:var(--ink); display:flex; flex-direction:column; align-items:center; padding:20px 0; flex-shrink:0; border-right:1px solid #262c38;}
  nav.side .brand{color:var(--paper); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.14em; writing-mode:vertical-rl; margin-bottom:24px; opacity:0.9;}
  nav.side .navbtn{background:none; border:none; color:var(--slate-dim); width:56px; height:56px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; margin-bottom:8px; font-size:9px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; transition:background .15s, color .15s;}
  nav.side .navbtn svg{width:20px; height:20px;}
  nav.side .navbtn.active{background:var(--accent); color:#fff;}
  nav.side .navbtn:not(.active):hover{background:#232a36; color:var(--paper);}
  nav.side .who{margin-top:auto; text-align:center;}
  nav.side .who .avatar{width:34px; height:34px; border-radius:50%; background:#2e3646; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; margin:0 auto 6px;}
  nav.side .who .name{color:var(--slate-dim); font-size:9px; font-weight:700; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  nav.side .logoutbtn{background:none;border:none;color:var(--slate-dim);font-size:9px;margin-top:6px;text-decoration:underline;}

  /* ---------- MAIN ---------- */
  main{flex:1; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; min-height:0;}
  header.topbar{padding:18px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); flex-shrink:0; gap:14px;}
  header.topbar h1{font-size:20px; margin:0; font-weight:800; letter-spacing:-0.01em;}
  header.topbar .sub{font-size:12px; color:var(--slate); font-family:'JetBrains Mono',monospace; flex:1; text-align:right;}
  .view{flex:1; overflow:auto; min-height:0; padding:24px 28px 100px;}

  /* ---------- SELL VIEW ---------- */
  .sell-grid{display:grid; grid-template-columns:1fr 360px; gap:20px; height:100%; align-items:start;}
  .scan-box{background:var(--ink); border-radius:16px; padding:16px; margin-bottom:18px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;}
  .scan-box input{flex:1; background:var(--ink-2); border:1px solid #2c3341; color:var(--paper); font-family:'JetBrains Mono',monospace; font-size:16px; padding:12px 14px; border-radius:10px; outline:none;}
  .scan-box input:focus{border-color:var(--accent);}
  .scan-box .hint{color:var(--slate-dim); font-size:11px; font-family:'JetBrains Mono',monospace; white-space:nowrap;}
  .cam-btn{background:var(--ink-2); border:1px solid #2c3341; color:var(--paper); width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cam-btn:hover{background:var(--accent); border-color:var(--accent);}
  .cam-btn svg{width:20px; height:20px;}
  .scan-input-wrap{position:relative; flex:1;}
  .scan-input-wrap input{width:100%;}
  .scan-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18); z-index:45; max-height:280px; overflow-y:auto; border:1px solid var(--line);
  }
  .scan-dropdown .sd-item{
    width:100%; text-align:left; padding:11px 14px; border:none; background:none; display:flex;
    justify-content:space-between; align-items:center; gap:10px; border-bottom:1px solid var(--paper-2);
  }
  .scan-dropdown .sd-item:last-child{border-bottom:none;}
  .scan-dropdown .sd-item:hover{background:var(--paper-2);}
  .scan-dropdown .sd-item:disabled{opacity:0.4;}
  .scan-dropdown .sd-name{font-weight:700; font-size:13px;}
  .scan-dropdown .sd-meta{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--slate); white-space:nowrap;}
  .scan-dropdown .sd-empty{padding:14px; font-size:12.5px; color:var(--slate-dim); text-align:center;}
  .camera-modal video{width:100%; border-radius:12px; background:#000; display:block; max-height:56vh; object-fit:cover;}
  .camera-modal .cam-caption{color:var(--slate); font-size:12.5px; text-align:center; margin-top:12px;}
  .camera-modal .cam-error{color:var(--danger); font-size:13px; text-align:center; padding:20px 6px; font-weight:600;}
  .camera-modal .cam-close{width:100%; background:var(--paper-2); color:var(--slate); border:none; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; margin-top:16px;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; padding-bottom:8px;}
  @media (max-width:820px), (max-height:500px){
    .product-grid{padding-bottom:24px;}
  }
  .pcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; text-align:left; transition:transform .1s, box-shadow .1s; position:relative;}
  .pcard:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.08);}
  .pcard:disabled{opacity:0.4; cursor:not-allowed;}
  .pcard .name{font-weight:700; font-size:13.5px; margin-bottom:6px; line-height:1.25;}
  .pcard .price{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--accent); font-size:15px;}
  .pcard .stock{font-size:10.5px; color:var(--slate); margin-top:5px; font-family:'JetBrains Mono',monospace;}
  .pcard .stock.low{color:var(--amber); font-weight:700;}
  .pcard .stock.out{color:var(--danger); font-weight:700;}
  .empty-note{color:var(--slate); font-size:13px; padding:30px 4px;}
  .alert-banner{background:#fbf1de; border:1px solid #eadfb8; color:var(--amber); font-size:12.5px; font-weight:700; padding:10px 14px; border-radius:10px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .alert-banner button{background:none;border:none;color:var(--amber);text-decoration:underline;font-weight:700;font-size:12px;}

  /* ---------- RECEIPT / CART ---------- */
  .receipt{background:#fff; border-radius:14px 14px 0 0; padding:20px 18px 8px; position:sticky; top:0; box-shadow:0 4px 24px rgba(0,0,0,0.06);}
  .receipt h2{font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin:0 0 14px; color:var(--slate); display:flex; justify-content:space-between;}
  .receipt .lines{max-height:calc(100vh - 500px); min-height:50px; overflow-y:auto; margin-bottom:6px;}
  .rline{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line); font-family:'JetBrains Mono',monospace; font-size:12.5px;}
  .rline .rname{flex:1; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;}
  .rname-wrap{flex:1; min-width:0;}
  .rname-wrap .rname{flex:none;}
  .rline-remaining{font-size:10.5px; font-family:'JetBrains Mono',monospace; color:var(--slate); margin-top:2px;}
  .rline-remaining.low{color:var(--amber); font-weight:700;}
  .rline-remaining.out{color:var(--danger); font-weight:700;}
  .rline .qtybtns{display:flex; align-items:center; gap:6px;}
  .rline .qtybtns button{width:20px; height:20px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); font-weight:700; font-size:12px; line-height:1;}
  .rline .qty{min-width:18px; text-align:center;}
  .qty-input{width:38px; text-align:center; border:1px solid var(--line); border-radius:6px; padding:2px 0; font-family:'JetBrains Mono',monospace; font-size:12.5px; -moz-appearance:textfield;}
  .qty-input::-webkit-inner-spin-button, .qty-input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .discount-row{display:flex; gap:6px;}
  .discount-row select{flex:0 0 52px; padding:8px 4px; border:1px solid var(--line); border-radius:8px; font-size:12px; font-family:'JetBrains Mono',monospace;}
  .discount-row input{flex:1;}
  .rline .lprice{min-width:56px; text-align:right; font-weight:600;}
  .rline .rm{background:none;border:none;color:var(--slate-dim);font-size:15px;padding:0 2px;}
  .rline .rm:hover{color:var(--danger);}
  .receipt-empty{text-align:center; color:var(--slate-dim); font-size:12.5px; padding:24px 0; font-family:'JetBrains Mono',monospace;}
  .customer-field{margin-top:10px;}
  .customer-field label{font-size:9.5px; text-transform:uppercase; color:var(--slate); font-weight:700; display:block; margin-bottom:3px; letter-spacing:0.04em;}
  .req-star{color:var(--danger); text-transform:none;}
  .loading-overlay{position:fixed; inset:0; background:rgba(28,26,46,0.35); display:flex; align-items:center; justify-content:center; z-index:9999; opacity:0; pointer-events:none; transition:opacity 0.15s ease;}
  .loading-overlay.show{opacity:1; pointer-events:all;}
  .loading-spinner{width:44px; height:44px; border-radius:50%; border:4px solid rgba(250,247,239,0.35); border-top-color:var(--paper); animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toggle-row{display:flex; gap:8px;}
  .toggle-opt{flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-weight:600; font-size:13px;}
  .toggle-opt.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .customer-field input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px;}
  .customer-input-wrap{position:relative;}
  .rextra{display:flex; gap:8px; margin:10px 0;}
  .rextra select, .rextra input{flex:1; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:12px; font-family:'JetBrains Mono',monospace;}
  .rextra label{font-size:9.5px; text-transform:uppercase; color:var(--slate); font-weight:700; display:block; margin-bottom:3px; letter-spacing:0.04em;}
  .rtotals{border-top:1px solid var(--ink); padding-top:10px; margin-top:4px; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .rtotals .row{display:flex; justify-content:space-between; padding:3px 0; color:var(--slate);}
  .rtotals .row.grand{color:var(--ink); font-weight:800; font-size:18px; padding-top:8px;}
  .perforation{height:14px; background:radial-gradient(circle at 6px 0, transparent 6px, #fff 6.5px) 0 0/16px 14px repeat-x; margin-top:0;}
  .checkout-btn{width:100%; background:var(--accent); color:#fff; border:none; padding:15px; border-radius:12px; font-weight:800; font-size:14.5px; letter-spacing:0.02em; margin-top:14px; transition:background .15s;}
  .checkout-btn:hover{background:var(--accent-dim);}
  .checkout-btn:disabled{background:#d8d2c0; cursor:not-allowed;}
  .clear-btn{width:100%; background:none; border:none; color:var(--slate-dim); font-size:12px; padding:8px; text-decoration:underline;}

  /* ---------- INVENTORY VIEW ---------- */
  .inv-toolbar{display:flex; gap:10px; margin-bottom:16px; align-items:center; flex-wrap:wrap;}
  .inv-toolbar input[type=text]{flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:13.5px; background:#fff;}
  .btn-primary{background:var(--ink); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-weight:700; font-size:13px; white-space:nowrap;}
  .btn-primary.godaam-btn{background:var(--accent);}
  .btn-primary.godaam-btn:hover{background:var(--accent-dim);}
  .btn-primary:hover{background:var(--ink-2);}
  table.inv{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; direction:ltr;}
  table.inv thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); padding:10px 14px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; white-space:nowrap;}
  table.inv td{padding:11px 14px; border-bottom:1px solid var(--paper-2); font-size:13px; white-space:nowrap;}
  html[dir="rtl"] table.inv thead th{text-align:right;}
  html[dir="rtl"] table.inv td{text-align:right;}
  .table-scroll-x{overflow-x:auto; border-radius:12px; direction:ltr; background:#fff;}
  table.inv td.mono{font-family:'JetBrains Mono',monospace;}
  table.inv tr:last-child td{border-bottom:none;}
  /* ---- Inventory list: CSS Grid (deterministic column placement, immune to RTL/content-length issues) ---- */
  .ig-grid{
    display:grid; direction:ltr; background:#fff; border-radius:12px;
    grid-template-columns: 170px 110px 110px 90px 90px 80px 80px 220px;
  }
  .ig-grid.godaam-grid{
    grid-template-columns: 180px 90px 110px 100px 100px 110px 150px;
  }
  .ig-grid.loan-grid{
    grid-template-columns: 90px 150px 100px 90px 100px 100px 130px 110px 130px;
  }
  .ig-grid.period-grid{
    grid-template-columns: minmax(190px,1fr) 110px 130px 130px;
  }
  .ig-grid.sales-grid{
    grid-template-columns: 130px 1fr 140px 120px 100px 100px 70px;
  }
  .ig-grid.restock-grid{
    grid-template-columns: 130px 1fr 90px 140px;
  }
  .ig-head{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate);
    padding:10px 14px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace;
    white-space:nowrap; text-align:left; background:#fff;
  }
  .ig-cell{
    padding:11px 14px; border-bottom:1px solid var(--paper-2); font-size:13px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; min-width:0;
  }
  .ig-cell.mono{font-family:'JetBrains Mono',monospace;}
  .ig-cell.ig-actions{overflow:visible; justify-content:flex-end; gap:4px;}
  .ig-empty{grid-column:1/-1; padding:30px 14px; color:var(--slate); font-size:13px; text-align:center;}
  html[dir="rtl"] .ig-head{text-align:right;}
  html[dir="rtl"] .ig-cell{justify-content:flex-end;}
  .stockpill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .stockpill.ok{background:#e5f3ec; color:var(--green);}
  .stockpill.low{background:#fbf1de; color:var(--amber);}
  .stockpill.out{background:#fbe8ea; color:var(--danger);}
  .marginpill{font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700;}
  .marginpill.good{color:var(--green);} .marginpill.mid{color:var(--amber);} .marginpill.bad{color:var(--danger);}
  .rowact{background:none;border:none;color:var(--slate-dim);font-size:13px;padding:4px 6px;}
  .rowact:hover{color:var(--ink);}
  .rowact.del:hover{color:var(--danger);}

  /* ---------- MODAL ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(20,24,31,0.55); display:flex; align-items:center; justify-content:center; z-index:50;}
  .modal{background:#fff; border-radius:16px; padding:26px; width:380px; max-width:90vw; max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 18px; font-size:16px; font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11px; color:var(--slate); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px;}
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .admin-toggle-label{display:flex !important; align-items:center; gap:8px; text-transform:none !important; font-size:13.5px !important; color:var(--ink) !important; font-weight:600 !important; cursor:pointer;}
  .admin-toggle-label input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; border:none;}
  .modal-actions .cancel{background:var(--paper-2); color:var(--slate);}
  .modal-actions .save{background:var(--accent); color:#fff;}
  .modal-actions .danger{background:var(--danger); color:#fff;}
  .loan-detail-note{background:var(--paper-2); border-radius:8px; padding:8px 10px; font-size:12.5px; color:var(--slate); margin-bottom:12px;}
  .loan-summary{background:var(--paper-2); border-radius:10px; padding:10px 12px; margin-bottom:10px;}
  .loan-summary div{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--slate);}
  .loan-summary .grand{font-weight:800; color:var(--ink); font-size:15px; border-top:1px solid var(--line); margin-top:4px; padding-top:6px;}
  .loan-subhead{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--slate); margin:14px 0 6px; font-weight:700;}
  .loan-pay-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--paper-2); font-size:12.5px;}
  .loan-pay-row:last-child{border-bottom:none;}
  .confirm-modal{width:320px;}
  .confirm-msg{font-size:14.5px; color:var(--ink); line-height:1.5; margin:4px 0 0;}

  /* ---------- PRINTABLE RECEIPT ---------- */
  .receipt-print-modal{width:340px;}
  .print-receipt{font-family:'JetBrains Mono',monospace; background:#fff; padding:6px 4px;}
  .pr-header{text-align:center; margin-bottom:10px;}
  .pr-brand{font-weight:800; font-size:14px; letter-spacing:0.08em;}
  .pr-meta{font-size:11px; color:var(--slate); margin-top:2px;}
  .pr-perforation{height:1px; border-top:1px dashed var(--line); margin:10px 0;}
  .pr-items{width:100%; border-collapse:collapse; font-size:12.5px;}
  .pr-items td{padding:4px 0;}
  .pr-totals .pr-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--slate);}
  .pr-totals .pr-grand{font-weight:800; color:var(--ink); font-size:15px; border-top:1px solid var(--ink); margin-top:4px; padding-top:6px;}
  .pr-totals .pr-pay{color:var(--slate-dim); font-size:11px;}
  @media print{

  .bar-fill.profit-fill{background:var(--green);}
  .bar-val{width:64px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; flex-shrink:0;}
  .bar-row .bar-val{width:auto; min-width:64px; display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .cust-profit{font-size:10px; font-weight:600; color:var(--green); text-transform:none;}
  .period-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .period-tab{background:var(--paper-2); border:none; color:var(--slate); padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700;}

// ---------------- SESSION TIMEOUT ----------------
const SESSION_TIMEOUT_MS = 30 * 60 * 1000; // auto-logout after 30 min of inactivity
function readSession(){
  try{
    const raw = sessionStorage.getItem('asanfrosh-session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function writeSession(id){
  sessionStorage.setItem('asanfrosh-session', JSON.stringify({id, expiresAt: Date.now() + SESSION_TIMEOUT_MS}));
}
function refreshSession(){
  if(!currentUser) return;
  const saved = readSession();
  if(saved && saved.id===currentUser.id) writeSession(currentUser.id);
}
function startSessionWatch(){
  ['click','keydown','touchstart'].forEach(evt=>{
    document.addEventListener(evt, refreshSession, {passive:true});
  });
  setInterval(()=>{
    if(!currentUser) return;
    const saved = readSession();
    if(!saved || saved.expiresAt <= Date.now()){
      showToast(t('toast_session_expired'));
      logout();
    }
  }, 30000);
}

// ---------------- CART LOGIC ----------------
function addToCart(productId){
  const p = products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const inCartQty = cart.find(c=>c.productId===productId)?.qty || 0;
  if(inCartQty >= p.stock){ showToast(t('toast_only_in_stock',{n:p.stock})); return; }
  const line = cart.find(c=>c.productId===productId);
  if(line) line.qty++; else cart.push({productId, qty:1});
  render();
}
function changeQty(productId, delta){
  const line = cart.find(c=>c.productId===productId);
  if(!line) return;
  const p = products.find(x=>x.id===productId);
  line.qty += delta;
  if(line.qty > p.stock){ line.qty = p.stock; showToast(t('toast_only_in_stock',{n:p.stock})); }
  if(line.qty <= 0) cart = cart.filter(c=>c.productId!==productId);
  render();
}
function setQty(productId, value){
  const line = cart.find(c=>c.productId===productId);
  const p = products.find(x=>x.id===productId);
  if(!line || !p) return;
  let n = parseInt(value);
  if(isNaN(n) || n<=0){ cart = cart.filter(c=>c.productId!==productId); render(); return; }
  if(n > p.stock){ n = p.stock; showToast(t('toast_only_in_stock',{n:p.stock})); }
  line.qty = n;
  render();
}
function removeLine(productId){ cart = cart.filter(c=>c.productId!==productId); render(); }
function cartSubtotal(){
  return cart.reduce((sum,c)=>{ const p = products.find(x=>x.id===c.productId); return sum + (p ? p.price*c.qty : 0); },0);
}
function cartTotals(){
  const subtotal = cartSubtotal();
  let discount = 0;
  if(checkoutOpts.discountMode === 'flat'){
    discount = Math.min(subtotal, Math.max(0, checkoutOpts.discountFlat||0));
  } else {
    discount = subtotal * ((checkoutOpts.discountPct||0)/100);
  }
  const taxable = Math.max(0, subtotal - discount);
  const tax = taxable * (settings.taxRate/100);
  const total = taxable + tax;
  return {subtotal, discount, tax, total};
}

    return {productId:c.productId, name:p.name, qty:c.qty, price:p.price, cost:p.cost||0};
  });
  const tt = cartTotals();
  cart.forEach(c=>{ const p = products.find(x=>x.id===c.productId); if(p) p.stock = Math.max(0, p.stock - c.qty); });
  const saleRecord = {
    id:uid(), timestamp:new Date().toISOString(), items,
    subtotal:tt.subtotal, discountMode:checkoutOpts.discountMode, discountPct:checkoutOpts.discountPct,
    discountFlat:checkoutOpts.discountFlat, discount:tt.discount,
    tax:tt.tax, total:tt.total, payment:checkoutOpts.payment,
    customerName:(checkoutOpts.customerName||'').trim() || DEFAULT_CUSTOMER_NAME,
    cashierId:currentUser.id, cashierName:currentUser.name, voided:false
  };
  sales.push(saleRecord);
  if(checkoutOpts.payment==='Loan'){
    addLoanCharge(saleRecord.customerName, saleRecord.total, checkoutOpts.loanNote, saleRecord.id);
    await saveLoans();
  }
  cart = []; checkoutOpts = {payment:'Cash', discountMode:'flat', discountPct:0, discountFlat:0, customerName:'', loanNote:''}; cartCollapsed = true; customerDropdownOpen = false;
  await saveProducts(); await saveSales();
  showToast(t('toast_sale_complete') + ' ' + money(tt.total));
  receiptModal = saleRecord;
  render();
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}
function handleScanInput(e){
  if(e.key === 'Escape'){ scanQuery=''; scanDropdownOpen=false; e.target.value=''; render(); return; }
  if(e.key !== 'Enter') return;
  const val = e.target.value.trim();
  if(!val) return;
  const exact = products.find(x=>x.barcode===val);
  if(exact){ addToCart(exact.id); }
  else{
    const matches = searchMatches(val);
    if(matches.length){ addToCart(matches[0].id); }
    else{ showToast(t('toast_no_match')+' "'+val+'"'); }
  }
  scanQuery=''; scanDropdownOpen=false; e.target.value='';
  render();
}
function handleScanTyping(e){
  scanQuery = e.target.value;
  scanDropdownOpen = scanQuery.trim().length > 0;
  updateScanDropdown();
}
function updateScanDropdown(){
  const wrap = document.querySelector('.scan-input-wrap');
  if(!wrap) return;
  let dd = document.getElementById('scanDropdown');
  if(scanDropdownOpen){
    const matches = searchMatches(scanQuery);
    const html = matches.length ? matches.map(p=>`
      <button class="sd-item" data-pick="${p.id}" ${p.stock<=0?'disabled':''}>
        <span class="sd-name">${escapeHtml(p.name)}</span>
        <span class="sd-meta">${money(p.price)} · ${stockLabel(p.stock)}</span>
      </button>`).join('') : `<div class="sd-empty">${t('no_products_match')}</div>`;
    if(!dd){
      dd = document.createElement('div');

function searchMatches(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return products.filter(p =>
    p.name.toLowerCase().includes(q) || p.barcode.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
  ).slice(0, 8);
}
function customerMatches(query){
  const q = query.trim().toLowerCase();
  const fromSales = sales.map(s=>(s.customerName||'').trim());
  const fromLoans = loans.map(l=>(l.customerName||'').trim());
  const names = [...new Set([...fromSales, ...fromLoans])].filter(Boolean);
  const filtered = q ? names.filter(n=>n.toLowerCase().includes(q)) : names;
  return filtered.slice(0, 6);
}

// ---------------- CAMERA SCAN ----------------
function openCameraModal(){ cameraModal = {open:true, error:''}; render(); }
function closeCameraModal(){
  if(cameraDetectLoop){ cancelAnimationFrame(cameraDetectLoop); cameraDetectLoop = null; }
  if(cameraStream){ cameraStream.getTracks().forEach(tr=>tr.stop()); cameraStream = null; }
  cameraModal = {open:false, error:''};
  render();
}
async function initCameraScan(){
  const video = document.getElementById('cameraVideo');
  if(!video) return;
  if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
    cameraModal.error = t('camera_unsupported'); render(); return;
  }
  if(!('BarcodeDetector' in window)){
    cameraModal.error = t('camera_unsupported'); render(); return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = cameraStream;
    await video.play();
    const detector = new window.BarcodeDetector();
    const loop = async ()=>{
      if(!cameraModal.open) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length){
          const val = codes[0].rawValue;
          closeCameraModal();
          lookupAndAddBarcode(val);
          return;
        }
      }catch(err){ /* keep trying */ }
      cameraDetectLoop = requestAnimationFrame(loop);
    };
    cameraDetectLoop = requestAnimationFrame(loop);
  }catch(err){
    cameraModal.error = t('camera_permission_error'); render();
  }
}
const VOID_WINDOW_MS = 24 * 60 * 60 * 1000;
function canVoidSale(s){
  if(!s || s.voided) return false;
  return (Date.now() - new Date(s.timestamp).getTime()) < VOID_WINDOW_MS;
}
async function voidSale(id){

  });
}

function openRestockModal(id){
  const p = products.find(x=>x.id===id);
  const linkedItem = findGodaamItemForProduct(p);
  if(linkedItem && (linkedItem.bagsCount>0 || linkedItem.extraDozens>0)){
    modalState = {mode:'restock', productId:id, draft:{linked:true, godaamId:linkedItem.id, bags:'', extraDozens:''}};
  } else {
    modalState = {mode:'restock', productId:id, draft:{linked:false, qty:''}};
  }
  render();
}
async function saveRestockModal(){
  if(isSubmitting) return; isSubmitting = true; showLoadingOverlay();
  try{
  const p = products.find(x=>x.id===modalState.productId);
  const d = modalState.draft;
  if(!p) return;

  if(d.linked){
    const item = godaamItems.find(g=>g.id===d.godaamId);
    if(!item){ showToast(t('restock_qty_invalid')); return; }
    const bagsUsed = parseInt(d.bags)||0;
    const extraUsed = parseInt(d.extraDozens)||0;
    const dozensAdded = bagsUsed*item.dozensPerBag + extraUsed;
    if(dozensAdded<=0){ showToast(t('restock_qty_invalid')); return; }
    if(dozensAdded>godaamTotalDozens(item)){ showToast(t('toast_godaam_remove_too_much')); return; }
    const stockBefore = p.stock;
    p.stock += dozensAdded;
    applyDozensDelta(item, -dozensAdded);
    item.history = item.history || [];
    item.history.push({
      id:uid(), date:new Date().toISOString(), type:'remove', bags:bagsUsed,
      note:t('godaam_restock_note',{n:dozensAdded, product:p.name})+(extraUsed>0?` (+${extraUsed} dzn)`:''),
      staffName:currentUser.name
    });
    restockLog.push({
      id:uid(), productId:p.id, productName:p.name, qtyAdded:dozensAdded,
      stockBefore, stockAfter:p.stock,
      staffId:currentUser.id, staffName:currentUser.name, timestamp:new Date().toISOString()
    });
    await saveProducts(); await saveGodaam(); await saveRestockLog();
    showToast(t('toast_restock_done',{name:p.name, n:dozensAdded}));
    modalState = null; render();
    return;
  }

  const qty = parseInt(d.qty);
  if(isNaN(qty) || qty<=0){ showToast(t('restock_qty_invalid')); return; }
  const stockBefore = p.stock;
  p.stock += qty;
  restockLog.push({
    id:uid(), productId:p.id, productName:p.name, qtyAdded:qty,
    stockBefore, stockAfter:p.stock,
    staffId:currentUser.id, staffName:currentUser.name, timestamp:new Date().toISOString()
  });
  await saveProducts(); await saveRestockLog();
  showToast(t('toast_restock_done',{name:p.name, n:qty}));
  modalState = null; render();
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}

// ---------------- LOANS ----------------
function loanChargedTotal(loan){ return (loan.charges||[]).reduce((a,c)=>a+c.amount,0); }
function loanPaidTotal(loan){ return (loan.payments||[]).reduce((a,p)=>a+p.amount,0); }
function loanRemaining(loan){ return Math.max(0, loanChargedTotal(loan) - loanPaidTotal(loan)); }
function loanStatus(loan){
  const remaining = loanRemaining(loan);
  if(remaining<=0.004) return 'paid';
  if(loanPaidTotal(loan)>0) return 'partial';
  return 'outstanding';
}
function loanStatusClass(status){ return status==='paid' ? 'ok' : status==='partial' ? 'low' : 'out'; }
function loanLastPayment(loan){
  const payments = loan.payments || [];
  if(!payments.length) return null;
  return payments.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
}
function loanDaysSinceLastPayment(loan){
  const last = loanLastPayment(loan);
  if(!last) return null;
  const diffMs = Date.now() - new Date(last.date).getTime();
  return Math.max(0, Math.floor(diffMs / (1000*60*60*24)));
}
function nextLoanCode(){
  const maxSeq = loans.reduce((max,l)=>Math.max(max, l.loanSeq||0), 0);
  return maxSeq + 1;
}
function formatLoanCode(seq){ return 'L' + String(seq).padStart(4,'0'); }
function findLoanByName(name, type){
  const q = (name||'').trim().toLowerCase();
  if(!q) return null;
  return loans.find(l=>(l.customerName||'').trim().toLowerCase() === q && (l.type||'borrower')===(type||'borrower')) || null;
}
function addLoanCharge(customerName, amount, note, saleId, type, currency){
  type = type==='giver' ? 'giver' : 'borrower';
  let loan = findLoanByName(customerName, type);
  const charge = {
    id:uid(), amount, note:(note||'').trim(), date:new Date().toISOString(),
    saleId:saleId||null, staffId:currentUser.id, staffName:currentUser.name
  };
  if(loan){
    // currency is locked at loan creation — ignore any currency argument for existing loans
    loan.charges = loan.charges || [];
    loan.charges.push(charge);
  } else {
    loan = {
      id:uid(), loanSeq:nextLoanCode(), customerName:customerName, type,
      currency: currency==='USD' ? 'USD' : 'AFN',
      createdAt:new Date().toISOString(), staffId:currentUser.id, staffName:currentUser.name,
      charges:[charge], payments:[]
    };
    loans.push(loan);
  }
  return loan;
}

// ---------------- GODAAM (WAREHOUSE) ----------------
function godaamTotalDozens(item){ return (item.bagsCount||0) * (item.dozensPerBag||0) + (item.extraDozens||0); }
// Applies a +/- change in total dozens to a godaam item, re-deriving whole
// bags + loose dozens from the new total (so pulling e.g. 20 dozens can
// "open" a bag rather than requiring a separate loose-dozens stash).
function applyDozensDelta(item, deltaDozens){
  const dpb = item.dozensPerBag || 0;
  const currentTotal = godaamTotalDozens(item);
  const newTotal = Math.max(0, currentTotal + deltaDozens);
  if(dpb > 0){
    item.bagsCount = Math.floor(newTotal / dpb);
    item.extraDozens = Math.round((newTotal - item.bagsCount * dpb) * 100) / 100;
  } else {
    item.bagsCount = 0;
    item.extraDozens = newTotal;
  }
  return newTotal;
}
function godaamTotalValue(item){ return godaamTotalDozens(item) * (item.costPerDozen||0); }
function godaamAllTotalValue(){ return godaamItems.reduce((a,it)=>a+godaamTotalValue(it),0); }

async function saveAddGodaamModal(){
  if(isSubmitting) return; isSubmitting = true; showLoadingOverlay();
  try{
  const d = modalState.draft;
  const name = (d.name||'').trim();
  const bags = parseFloat(d.bagsCount);
  const dozensPerBag = parseFloat(d.dozensPerBag);
  const extra = d.extraDozens ? parseFloat(d.extraDozens) : 0;
  const cost = parseFloat(d.costPerDozen);
  if(!name){ showToast(t('toast_godaam_name_required')); return; }
  const nameLower = name.toLowerCase();
  if(godaamItems.find(g=>g.name.trim().toLowerCase()===nameLower)){
    showToast(t('toast_duplicate_godaam_name')); return;
  }
  if(isNaN(bags) || bags<0 || isNaN(dozensPerBag) || dozensPerBag<0 || isNaN(cost) || cost<0 || isNaN(extra) || extra<0){
    showToast(t('toast_godaam_invalid')); return;
  }
  const item = {
    id:uid(), name, bagsCount:bags, dozensPerBag, costPerDozen:cost, extraDozens:extra,
    createdAt:new Date().toISOString(), staffId:currentUser.id, staffName:currentUser.name,
    history: (bags>0||extra>0) ? [{id:uid(), date:new Date().toISOString(), type:'add', bags, note:t('godaam_initial_stock')+(extra>0?` (+${extra} dzn)`:''), staffName:currentUser.name}] : []
  };
  godaamItems.push(item);
  await saveGodaam();
  await syncGodaamItemToInventory(item);
  showToast(t('toast_godaam_added'));
  modalState = null; render();
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}
async function syncGodaamItemToInventory(item){
  const nameLower = item.name.trim().toLowerCase();
  const existing = products.find(p=>p.name.trim().toLowerCase()===nameLower);
  if(existing) return;
  const cost = item.costPerDozen || 0;
  const price = Math.round(cost * 1.10 * 100) / 100;
  const newProduct = {
    id:uid(), name:item.name, barcode:'', price, cost, stock:0, category:'Warehouse'
  };
  products.push(newProduct);
  editLog.push({
    id:uid(), productId:newProduct.id, productName:newProduct.name, action:'add', changes:[],
    staffId:currentUser.id, staffName:currentUser.name+' ('+t('godaam_auto_sync')+')', timestamp:new Date().toISOString()
  });
  await saveProducts(); await saveEditLog();
}

async function saveGodaamAdjustment(){
  if(isSubmitting) return; isSubmitting = true; showLoadingOverlay();
  try{
  const item = godaamItems.find(g=>g.id===modalState.godaamId);
  if(!item) return;
  const d = modalState.draft;
  const bags = d.bags ? parseFloat(d.bags) : 0;
  const extra = d.extraDozens ? parseFloat(d.extraDozens) : 0;
  if((isNaN(bags)||bags<0) || (isNaN(extra)||extra<0) || (bags<=0 && extra<=0)){ showToast(t('toast_godaam_invalid')); return; }
  const dozensChanged = bags*(item.dozensPerBag||0) + extra;
  if(d.type==='remove' && dozensChanged>godaamTotalDozens(item)){ showToast(t('toast_godaam_remove_too_much')); return; }
  applyDozensDelta(item, d.type==='remove' ? -dozensChanged : dozensChanged);
  item.history = item.history || [];
  item.history.push({id:uid(), date:new Date().toISOString(), type:d.type, bags, note:(d.note||'').trim()+(extra>0?` (${d.type==='remove'?'-':'+'}${extra} dzn)`:''), staffName:currentUser.name});
  await saveGodaam();
  showToast(t('toast_godaam_adjusted'));
  modalState = {mode:'godaamDetail', godaamId:item.id, draft:{type:'add', bags:'', extraDozens:'', note:''}};
  render();
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}
async function deleteGodaamItem(id, reason){
  if(isSubmitting) return; isSubmitting = true; showLoadingOverlay();
  try{
  const item = godaamItems.find(g=>g.id===id);
  if(item){
    godaamDeleteLog.push({
      id:uid(), itemId:item.id, itemName:item.name, bagsAtDeletion:item.bagsCount,
      dozensPerBag:item.dozensPerBag, costPerDozen:item.costPerDozen,
      totalDozensAtDeletion:godaamTotalDozens(item), totalValueAtDeletion:godaamTotalValue(item),
      reason:(reason||'').trim(), deletedAt:new Date().toISOString(),
      staffId:currentUser.id, staffName:currentUser.name
    });
    await saveGodaamDeleteLog();
  }
  godaamItems = godaamItems.filter(g=>g.id!==id);
  await saveGodaam();
  modalState = null;
  render();
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}

function reportStats(){
  const valid = sales.filter(s=>!s.voided);
  const today = new Date(); today.setHours(0,0,0,0);
  const todaySales = valid.filter(s=> new Date(s.timestamp) >= today);
  const revenueToday = todaySales.reduce((a,s)=>a+s.total,0);
  const revenueAll = valid.reduce((a,s)=>a+s.total,0);
  const costAll = valid.reduce((a,s)=>a + s.items.reduce((x,it)=>x+ (it.cost||0)*it.qty,0), 0);
  const costToday = todaySales.reduce((a,s)=>a + s.items.reduce((x,it)=>x+ (it.cost||0)*it.qty,0), 0);
  const profitAll = revenueAll - costAll;
  const profitToday = revenueToday - costToday;
  const itemsSold = {};
  const itemsProfit = {};
  valid.forEach(s=>s.items.forEach(it=>{
    itemsSold[it.name] = (itemsSold[it.name]||0) + it.qty;
    itemsProfit[it.name] = (itemsProfit[it.name]||0) + ((it.price - (it.cost||0)) * it.qty);
  }));
  const top = Object.entries(itemsSold).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topProfit = Object.entries(itemsProfit).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const customerStats = {};
  valid.forEach(s=>{
    const name = (s.customerName||'').trim();
    if(!name) return;
    if(!customerStats[name]) customerStats[name] = {revenue:0, cost:0};
    customerStats[name].revenue += s.total;
    customerStats[name].cost += s.items.reduce((a,it)=>a+(it.cost||0)*it.qty,0);
  });
  const topCustomers = Object.entries(customerStats)
    .map(([name,v])=>({name, revenue:v.revenue, profit:v.revenue-v.cost}))
    .sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  const lowStock = products.filter(p=>p.stock>0 && p.stock<=settings.lowStockThreshold).length;
  const outStock = products.filter(p=>p.stock===0).length;
  return {revenueToday, revenueAll, profitToday, profitAll, salesCount:valid.length, todayCount:todaySales.length, top, topProfit, topCustomers, lowStock, outStock};
}
function periodStats(period){
  const valid = sales.filter(s=>!s.voided);
  const groups = {};
  valid.forEach(s=>{
    const d = new Date(s.timestamp);
    let key, label;
    if(period==='daily'){
      key = d.toISOString().slice(0,10);
      label = d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    } else if(period==='monthly'){
      key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      label = d.toLocaleDateString(undefined,{year:'numeric',month:'long'});
    } else {
      key = String(d.getFullYear());
      label = key;
    }
    if(!groups[key]) groups[key] = {label, revenue:0, cost:0, count:0};
    groups[key].revenue += s.total;
    groups[key].cost += s.items.reduce((a,it)=>a+(it.cost||0)*it.qty,0);
    groups[key].count += 1;
  });
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([key,v])=>({
    key, label:v.label, revenue:v.revenue, profit:v.revenue-v.cost, count:v.count
  }));
}

function stockClass(stock){ if(stock===0) return 'out'; if(stock<=settings.lowStockThreshold) return 'low'; return 'ok'; }
function stockLabel(stock){ if(stock===0) return 'Out of stock'; if(stock<=settings.lowStockThreshold) return stock+' left'; return stock+' in stock'; }
function marginClass(pct){ if(pct>=40) return 'good'; if(pct>=15) return 'mid'; return 'bad'; }
function formatFieldValue(field, value){
  if(field==='cost' || field==='price') return money(value||0);
  const s = (value===undefined || value===null || value==='') ? '—' : String(value);
  return escapeHtml(s);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function buildLoanCells(type){
  const q = (loanSearch||'').trim().toLowerCase();
  const filtered = loans.filter(l=>{
    if((l.type||'borrower')!==type) return false;
    if(!q) return true;
    const code = formatLoanCode(l.loanSeq||0).toLowerCase();
    return (l.customerName||'').toLowerCase().includes(q) || code.includes(q);
  });
  let sorted;
  if(loanSortByLastPayment){
    sorted = filtered.slice().sort((a,b)=>{
      const da = loanDaysSinceLastPayment(a); const db = loanDaysSinceLastPayment(b);
      const va = da===null ? Infinity : da;
      const vb = db===null ? Infinity : db;
      return vb - va;
    });
  } else {
    sorted = filtered.slice().sort((a,b)=>{
      const remA = loanRemaining(a), remB = loanRemaining(b);
      if((remA<=0)!==(remB<=0)) return remA<=0 ? 1 : -1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
  }
  if(!sorted.length){
    return `<div class="ig-empty">${t(q?'no_products_match': (type==='giver'?'no_loan_givers_yet':'no_loans_yet'))}</div>`;
  }
  return sorted.map(l=>{
    const paid = loanPaidTotal(l);
    const remaining = loanRemaining(l);
    const status = loanStatus(l);
    const lastPay = loanLastPayment(l);
    const days = loanDaysSinceLastPayment(l);
    const daysLabel = days===null ? t('never_paid') : t('days_ago',{n:days});
    const lastAmtLabel = lastPay ? money(lastPay.amount) : '—';
    return `
      <div class="ig-cell mono">${formatLoanCode(l.loanSeq||0)}</div>
      <div class="ig-cell">${escapeHtml(l.customerName)}</div>
      <div class="ig-cell mono">${loanMoney(loanChargedTotal(l), l)}</div>
      <div class="ig-cell mono">${loanMoney(paid, l)}</div>
      <div class="ig-cell mono">${loanMoney(remaining, l)}</div>
      <div class="ig-cell"><span class="stockpill ${loanStatusClass(status)}">${t('loan_status_'+status)}</span></div>
      <div class="ig-cell mono">${daysLabel}</div>
      <div class="ig-cell mono">${lastAmtLabel}</div>
      <div class="ig-cell ig-actions"><button class="rowact" data-loandetail="${l.id}">${t('loan_manage')}</button></div>`;
  }).join('');
}

function sumByCurrency(loanList){
  const totals = {AFN:0, USD:0};
  loanList.forEach(l=>{ totals[l.currency==='USD'?'USD':'AFN'] += loanRemaining(l); });
  return totals;
}
function formatCurrencyTotals(totals){
  const parts = [];
  if(totals.AFN>0) parts.push(CURRENCY_SYMBOLS.AFN + totals.AFN.toFixed(2));
  if(totals.USD>0) parts.push(CURRENCY_SYMBOLS.USD + totals.USD.toFixed(2));
  return parts.length ? parts.join(' + ') : (CURRENCY_SYMBOLS.AFN + '0.00');
}

  const withBalance = loans.filter(l=>(l.type||'borrower')==='borrower' && loanRemaining(l)>0)

  const bars = withBalance.length ? withBalance.map(l=>`
    <div class="bar-row"><div class="bname">${escapeHtml(l.customerName)}</div><div class="bar-track"><div class="bar-fill" style="background:var(--danger);width:${Math.max(0,(loanRemaining(l)/maxOwed*100)).toFixed(0)}%"></div></div><div class="bar-val">${loanMoney(loanRemaining(l), l)}</div></div>`).join('') : `<div class="empty-note">${t('no_loans_yet')}</div>`;
  return `

    <h3>${t('top_loaners')}</h3>

  </div>`;
}

  const withBalance = loans.filter(l=>l.type==='giver' && loanRemaining(l)>0)
    .slice().sort((a,b)=>loanRemaining(b)-loanRemaining(a)).slice(0,8);

// Downloads any of our print-ready HTML templates as a real PDF by rendering
// it through the browser (so Pashto/Dari/any script displays correctly,
// unlike jsPDF's built-in fonts which only support Latin text and show
// garbled boxes for Arabic-script languages) and snapshotting it as an image.
async function downloadHtmlAsPdf(html, filename){
  if(isSubmitting) return; isSubmitting = true; showLoadingOverlay();
  try{
    if(!window.html2canvas || !window.jspdf){ showToast(t('print_unavailable')); return; }
    let frame = document.getElementById('pdfRenderFrame');
    if(frame) frame.remove();
    frame = document.createElement('iframe');
    frame.id = 'pdfRenderFrame';
    frame.style.position = 'fixed';
    frame.style.left = '-99999px';
    frame.style.top = '0';
    frame.style.width = '800px';
    frame.style.height = '600px';
    frame.style.border = '0';
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();

    await new Promise(resolve=>{
      if(doc.readyState==='complete') setTimeout(resolve, 200);
      else frame.onload = ()=>setTimeout(resolve, 200);
    });
    try{ if(frame.contentWindow.document.fonts) await frame.contentWindow.document.fonts.ready; }catch(e){}

    const body = doc.body;
    const widthPx = Math.max(body.scrollWidth, 800);
    const heightPx = Math.max(body.scrollHeight, 100);
    frame.style.height = heightPx + 'px';

    const canvas = await html2canvas(body, {scale:2, backgroundColor:'#ffffff', width:widthPx, windowWidth:widthPx});
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pageWidthPt = widthPx * 0.75;
    const pageHeightPt = heightPx * 0.75;
    const pdf = new jsPDF({unit:'pt', format:[pageWidthPt, pageHeightPt]});
    pdf.addImage(imgData, 'PNG', 0, 0, pageWidthPt, pageHeightPt);
    pdf.save(filename);

    frame.remove();
  }catch(e){
    showToast(t('print_unavailable'));
  } finally { isSubmitting = false; hideLoadingOverlay(); }
}
// Prints via a hidden iframe instead of window.open — opening a new tab/window
// can fully kick the user out of the app when installed as a PWA, with no way
// back. An iframe never navigates the page away, so the app stays put.
function printHtmlContent(html){
  try{
    let frame = document.getElementById('printFrame');
    if(frame) frame.remove();
    frame = document.createElement('iframe');
    frame.id = 'printFrame';
    frame.style.position = 'fixed';
    frame.style.right = '0';
    frame.style.bottom = '0';
    frame.style.width = '0';
    frame.style.height = '0';
    frame.style.border = '0';
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    const doPrint = ()=>{
      try{ frame.contentWindow.focus(); frame.contentWindow.print(); }catch(e){}
      setTimeout(()=>{ const f = document.getElementById('printFrame'); if(f) f.remove(); }, 1000);
    };
    if(frame.contentWindow.document.readyState === 'complete') setTimeout(doPrint, 200);
    else frame.onload = ()=>setTimeout(doPrint, 200);
  }catch(e){
    showToast(t('print_unavailable'));
  }
}

function buildLoanDetailPdf(loan){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF) return null;
  const rowCount = (loan.charges||[]).length + (loan.payments||[]).length;
  const doc = new jsPDF({unit:'pt', format:[320, 420 + rowCount*16]});
  let y = 30;
  doc.setFont('courier','bold'); doc.setFontSize(13);
  doc.text(t('brand'), 160, y, {align:'center'}); y += 16;
  doc.setFont('courier','normal'); doc.setFontSize(9);
  doc.text(loan.customerName+' — '+formatLoanCode(loan.loanSeq||0), 160, y, {align:'center'}); y += 13;
  doc.text(new Date().toLocaleString(), 160, y, {align:'center'}); y += 16;
  doc.setDrawColor(200); doc.line(20, y, 300, y); y += 16;
  const line = (label, val, bold)=>{
    doc.setFont('courier', bold?'bold':'normal'); doc.setFontSize(bold?11:9);
    doc.text(label, 20, y); doc.text(val, 300, y, {align:'right'}); y += bold?18:14;
  };
  line(t('loan_original'), loanMoney(loanChargedTotal(loan), loan));
  line(t('loan_paid'), loanMoney(loanPaidTotal(loan), loan));
  doc.line(20, y-4, 300, y-4); y += 4;
  line(t('loan_remaining'), loanMoney(loanRemaining(loan), loan), true);
  y += 10;
  doc.setFont('courier','bold'); doc.setFontSize(10); doc.text(t('loan_charge_history'), 20, y); y += 14;
  doc.setFontSize(9); doc.setFont('courier','normal');
  (loan.charges||[]).forEach(c=>{
    doc.text(new Date(c.date).toLocaleDateString(), 20, y);
    doc.text(loanMoney(c.amount, loan), 300, y, {align:'right'}); y += 14;
  });
  y += 8;
  doc.setFont('courier','bold'); doc.setFontSize(10); doc.text(t('loan_payment_history'), 20, y); y += 14;
  doc.setFontSize(9); doc.setFont('courier','normal');
  (loan.payments||[]).forEach(p=>{
    doc.text(new Date(p.date).toLocaleDateString(), 20, y);
    doc.text(loanMoney(p.amount, loan), 300, y, {align:'right'}); y += 14;
  });
  return doc;
}
function downloadLoanDetail(loanId){
  try{
    const loan = loans.find(l=>l.id===loanId);
    if(!loan) return;
    const html = buildLoanDetailHtml(loan);
    downloadHtmlAsPdf(html, 'loan-'+formatLoanCode(loan.loanSeq||0)+'.pdf');
  }catch(e){
    showToast(t('print_unavailable'));
  }
}
function tryPrintLoanDetail(loanId){
  try{
    const loan = loans.find(l=>l.id===loanId);
    if(!loan) return;
    const html = buildLoanDetailHtml(loan);
    printHtmlContent(html);
  }catch(e){
    showToast(t('print_unavailable'));
  }
}

    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>${t('delete_confirm_title')}</h3>
        <div class="loan-detail-note">${escapeHtml(modalState.itemLabel||'')}</div>
        <div class="field"><label>${t('delete_reason_label')}</label><input type="text" id="del-reason" value="${escapeAttr(d.reason)}" placeholder="${t('delete_reason_placeholder')}"></div>
        <div class="modal-actions">
          <button class="cancel" id="modalCancel">${t('cancel')}</button>
          <button class="cancel danger" id="modalConfirmDeleteReason">${t('delete')}</button>
        </div>
      </div>
    </div>`;
  }
  // staff modal
  return `
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>${modalState.mode==='addStaff'?t('add_staff'):t('edit_staff')}</h3>
      <div class="field"><label>${t('name')}</label><input type="text" id="s-name" value="${escapeAttr(d.name)}" placeholder="e.g. Alex"></div>
      <div class="field"><label>${t('role')}</label><input type="text" id="s-role" value="${escapeAttr(d.role)}" placeholder="e.g. Cashier"></div>
      <div class="field"><label>${t('username_label')}</label><input type="text" id="s-username" value="${escapeAttr(d.username)}" placeholder="${t('username_placeholder')}" autocapitalize="off"></div>
      <div class="field"><label>${t('password_label')}${modalState.mode==='editStaff'?' ('+t('leave_blank_keep')+')':''}</label><input type="password" id="s-password" value="${escapeAttr(d.password)}" placeholder="${modalState.mode==='editStaff'?t('password_placeholder_edit'):t('password_placeholder')}" autocomplete="new-password"></div>
      <div class="field admin-toggle">
        <label class="admin-toggle-label"><input type="checkbox" id="s-admin" ${d.isAdmin?'checked':''}> ${t('admin_access')}</label>
      </div>
      <div class="modal-actions">
        <button class="cancel" id="modalCancel">${t('cancel')}</button>
        <button class="save" id="modalSaveStaff">${modalState.mode==='addStaff'?t('add_staff'):t('save_changes')}</button>
      </div>
    </div>
  </div>`;
}

function render(){
  applyDirection();
  const app = document.getElementById('app');

  if(!currentUser){
    app.innerHTML = renderLogin();
    const uEl = document.getElementById('login-username');
    const pEl = document.getElementById('login-password');
    if(uEl) uEl.addEventListener('input', e=>{ loginForm.username = e.target.value; });
    if(pEl) pEl.addEventListener('input', e=>{ loginForm.password = e.target.value; });
    const submitBtn = document.getElementById('loginSubmit');
    if(submitBtn) submitBtn.addEventListener('click', attemptLogin);
    const onEnter = e=>{ if(e.key==='Enter') attemptLogin(); };
    if(uEl) uEl.addEventListener('keydown', onEnter);
    if(pEl) pEl.addEventListener('keydown', onEnter);
    document.querySelectorAll('[data-setlang]').forEach(b=>b.addEventListener('click', async ()=>{ settings.lang = b.dataset.setlang; await saveSettings(); render(); }));
    return;
  }

  const titles = {sell:t('sell'), inventory:t('inventory'), loans:t('loans'), reports:t('reports'), settings:t('settings')};
  const subs = {sell:t('sub_sell'), inventory:t('sub_inventory'), loans:t('sub_loans'), reports:t('sub_reports'), settings:t('sub_settings')};

  let viewHtml = '';
  if(currentView==='sell') viewHtml = renderSell();
  else if(currentView==='inventory') viewHtml = renderInventory();
  else if(currentView==='loans') viewHtml = renderLoans();
  else if(currentView==='reports') viewHtml = renderReports();
  else viewHtml = renderSettings();

  const initials = currentUser.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  const prevViewEl = document.querySelector('.view');
  const prevScrollTop = prevViewEl ? prevViewEl.scrollTop : 0;
  const prevScrollXEl = document.querySelector('.table-scroll-x');
  const prevScrollLeft = prevScrollXEl ? prevScrollXEl.scrollLeft : 0;
  const sameView = (currentView === lastRenderedView);

  app.innerHTML = `
    <nav class="side">
      <div class="brand">${t('brand')}</div>
      ${renderNav()}
      <div class="who">
        <div class="avatar">${initials}</div>
        <div class="name">${escapeHtml(currentUser.name)}</div>
        <button class="logoutbtn" id="logoutBtn">${t('log_out')}</button>
      </div>
    </nav>
    <main>
      <header class="topbar">
        <div><h1>${titles[currentView]}</h1></div>
        <div class="sub">${subs[currentView]}</div>
        <div class="topbar-account">
          <div class="avatar">${initials}</div>
          <button id="logoutBtnMobile">${t('log_out')}</button>
        </div>
      </header>
      <div class="view">${viewHtml}</div>
    </main>
    <nav class="bottom">${renderNav()}</nav>
    ${renderModal()}
    ${renderCameraModal()}
    ${renderConfirmModal()}
    ${renderReceiptModal()}
  `;

  if(sameView){
    const newViewEl = document.querySelector('.view');
    if(newViewEl) newViewEl.scrollTop = prevScrollTop;
    const newScrollXEl = document.querySelector('.table-scroll-x');
    if(newScrollXEl) newScrollXEl.scrollLeft = prevScrollLeft;
  }
  lastRenderedView = currentView;

  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{ currentView=b.dataset.nav; render(); }));
  const logoutBtn = document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.addEventListener('click', logout);
  const logoutBtnMobile = document.getElementById('logoutBtnMobile'); if(logoutBtnMobile) logoutBtnMobile.addEventListener('click', logout);

  if(currentView==='sell'){
    const scanInput = document.getElementById('scanInput');
    if(scanInput){
      scanInput.addEventListener('keydown', handleScanInput);
      scanInput.addEventListener('input', handleScanTyping);
      scanInput.addEventListener('blur', ()=>{ setTimeout(()=>{ if(scanDropdownOpen){ scanDropdownOpen=false; render(); } }, 160); });
    }
    document.querySelectorAll('#scanDropdown [data-pick]').forEach(b=>{
      b.addEventListener('mousedown', e=>e.preventDefault());
      b.addEventListener('click', ()=>pickSearchResult(b.dataset.pick));
    });
    document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.add)));
    document.querySelectorAll('[data-qty]').forEach(b=>b.addEventListener('click',()=>{ const [id,delta] = b.dataset.qty.split(':'); changeQty(id, parseInt(delta)); }));
    document.querySelectorAll('[data-qtyinput]').forEach(inp=>{
      inp.addEventListener('change', e=>setQty(inp.dataset.qtyinput, e.target.value));
      inp.addEventListener('click', e=>e.target.select());
    });
    document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>removeLine(b.dataset.rm)));
    const co = document.getElementById('checkoutBtn'); if(co) co.addEventListener('click', checkout);
    const cl = document.getElementById('clearBtn'); if(cl) cl.addEventListener('click', ()=>{ cart=[]; render(); });
    const pay = document.getElementById('paymentSelect'); if(pay) pay.addEventListener('change', e=>{ checkoutOpts.payment = e.target.value; customerDropdownOpen=false; render(); });
    const discMode = document.getElementById('discountModeSelect'); if(discMode) discMode.addEventListener('change', e=>{ checkoutOpts.discountMode = e.target.value; customerDropdownOpen=false; render(); });
    const custName = document.getElementById('customerNameInput');
    if(custName){
      custName.addEventListener('input', e=>{
        checkoutOpts.customerName = e.target.value;
        const exactMatch = customerMatches(e.target.value).some(n=>n.toLowerCase()===e.target.value.trim().toLowerCase());
        customerDropdownOpen = !exactMatch;
        updateCustomerDropdown();
      });
      custName.addEventListener('keydown', e=>{
        if(e.key==='Enter' || e.key==='Escape'){
          customerDropdownOpen = false;
          render();
        }
      });
      custName.addEventListener('focus', ()=>{ if(!customerDropdownOpen){ customerDropdownOpen = true; render(); const el=document.getElementById('customerNameInput'); if(el){ el.focus(); const p=el.value.length; el.setSelectionRange(p,p); } } });
      custName.addEventListener('blur', ()=>{ setTimeout(()=>{ if(customerDropdownOpen){ customerDropdownOpen=false; render(); } }, 160); });
    }
    document.querySelectorAll('#customerDropdown [data-pickcustomer]').forEach(b=>{
      b.addEventListener('mousedown', e=>e.preventDefault());
      b.addEventListener('click', ()=>pickCustomerName(b.dataset.pickcustomer));
    });
    const loanNote = document.getElementById('loanNoteInput'); if(loanNote) loanNote.addEventListener('input', e=>{
      checkoutOpts.loanNote = e.target.value;
      const cursorPos = e.target.selectionStart;
      render();
      const el = document.getElementById('loanNoteInput');
      if(el){ el.focus(); if(cursorPos!=null) el.setSelectionRange(cursorPos, cursorPos); }
    });
    const disc = document.getElementById('discountInput');
    if(disc){
      disc.addEventListener('focus', ()=>{ if(customerDropdownOpen){ customerDropdownOpen=false; render(); } });
      disc.addEventListener('input', e=>{
        const v = Math.max(0, parseFloat(e.target.value)||0);
        if(checkoutOpts.discountMode==='flat'){ checkoutOpts.discountFlat = v; } else { checkoutOpts.discountPct = Math.min(100, v); }
        const cursorPos = e.target.selectionStart;
        render();
        const el = document.getElementById('discountInput');
        if(el){ el.focus(); if(cursorPos!=null) el.setSelectionRange(cursorPos, cursorPos); }
      });
    }
    const dismiss = document.getElementById('dismissAlert'); if(dismiss) dismiss.addEventListener('click', ()=>{ dismissedAlert=true; render(); });
    const camBtn = document.getElementById('openCameraBtn'); if(camBtn) camBtn.addEventListener('click', openCameraModal);
    const handle = document.getElementById('receiptHandle'); if(handle) handle.addEventListener('click', toggleCartCollapsed);
  }
  if(currentView==='inventory' && !showGodaam){
    const s = document.getElementById('invSearchInput');
    if(s){
      s.addEventListener('input', e=>{
        invSearch = e.target.value;
        updateInventoryTable();
      });
    }
    const godaamBtn = document.getElementById('openGodaamBtn'); if(godaamBtn) godaamBtn.addEventListener('click', ()=>{ showGodaam=true; render(); });
    const add = document.getElementById('addProductBtn'); if(add) add.addEventListener('click', openAddModal);
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditModal(b.dataset.edit)));
    document.querySelectorAll('[data-restock]').forEach(b=>b.addEventListener('click',()=>openRestockModal(b.dataset.restock)));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
      if(!isAdmin()) return;
      askConfirm(t('confirm_delete_product'), async ()=>{ await deleteProduct(b.dataset.del); });
    }));
  }
  if(currentView==='inventory' && showGodaam){
    const backBtn = document.getElementById('backToInventoryBtn'); if(backBtn) backBtn.addEventListener('click', ()=>{ showGodaam=false; render(); });
    const addGodaamBtn = document.getElementById('addGodaamBtn'); if(addGodaamBtn) addGodaamBtn.addEventListener('click', openAddGodaamModal);
    const printGodaamBtn = document.getElementById('printGodaamListBtn'); if(printGodaamBtn) printGodaamBtn.addEventListener('click', tryPrintGodaamList);
    document.querySelectorAll('[data-godaamdetail]').forEach(b=>b.addEventListener('click',()=>openGodaamDetailModal(b.dataset.godaamdetail)));
    const godaamSearchInput = document.getElementById('godaamSearchInput');
    if(godaamSearchInput){
      godaamSearchInput.addEventListener('input', e=>{
        godaamSearch = e.target.value;
        updateGodaamTable();
      });
    }
  }
  if(currentView==='reports'){
    document.querySelectorAll('[data-void]').forEach(b=>b.addEventListener('click',()=>voidSale(b.dataset.void)));
    document.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{ reportPeriod = b.dataset.period; render(); }));
    const downloadPeriodBtn = document.getElementById('downloadPeriodBtn'); if(downloadPeriodBtn) downloadPeriodBtn.addEventListener('click', downloadPeriodReport);
    const printPeriodBtn = document.getElementById('printPeriodBtn'); if(printPeriodBtn) printPeriodBtn.addEventListener('click', tryPrintPeriodReport);
  }
  if(currentView==='loans'){
    const addLoanBtn = document.getElementById('addLoanBtn'); if(addLoanBtn) addLoanBtn.addEventListener('click', openAddLoanModal);
    document.querySelectorAll('[data-loandetail]').forEach(b=>b.addEventListener('click',()=>openLoanDetailModal(b.dataset.loandetail)));
    const loanSearchInput = document.getElementById('loanSearchInput');
    if(loanSearchInput){
      loanSearchInput.addEventListener('input', e=>{
        loanSearch = e.target.value;
        updateLoanTable();
      });
    }
    const sortLoansBtn = document.getElementById('sortLoansBtn'); if(sortLoansBtn) sortLoansBtn.addEventListener('click', ()=>{ loanSortByLastPayment = !loanSortByLastPayment; render(); });
    const printLoanListBtn = document.getElementById('printLoanListBtn'); if(printLoanListBtn) printLoanListBtn.addEventListener('click', tryPrintLoanList);
    const downloadLoanListBtn = document.getElementById('downloadLoanListBtn'); if(downloadLoanListBtn) downloadLoanListBtn.addEventListener('click', downloadLoanList);
  }
  if(currentView==='settings'){
    const addStaffBtn = document.getElementById('addStaffBtn'); if(addStaffBtn) addStaffBtn.addEventListener('click', openAddStaffModal);
    document.querySelectorAll('[data-editstaff]').forEach(b=>b.addEventListener('click',()=>openEditStaffModal(b.dataset.editstaff)));
    document.querySelectorAll('[data-delstaff]').forEach(b=>b.addEventListener('click',()=>{
      if(!isAdmin()) return;
      askConfirm(t('confirm_delete_staff'), async ()=>{ await deleteStaff(b.dataset.delstaff); });
    }));
    const langSelect = document.getElementById('langSelect');
    if(langSelect) langSelect.addEventListener('change', async e=>{ settings.lang = e.target.value; await saveSettings(); render(); });
    const saveBtn = document.getElementById('saveSettingsBtn');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      const tr = parseFloat(document.getElementById('taxRateInput').value) || 0;
      const ls = parseInt(document.getElementById('lowStockInput').value) || 0;
      settings.taxRate = tr; settings.lowStockThreshold = ls;
      await saveSettings(); showToast(t('toast_settings_saved')); render();
    });
  }

  if(modalState){
    if(modalState.mode==='add' || modalState.mode==='edit'){
      const bind = (id,key)=>{ const el = document.getElementById(id); el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('f-name','name'); bind('f-barcode','barcode'); bind('f-category','category'); bind('f-cost','cost'); bind('f-price','price'); bind('f-stock','stock');
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalSave').addEventListener('click', saveModal);
    } else if(modalState.mode==='restock'){
      if(modalState.draft.linked){
        const bagsInput = document.getElementById('r-bags');
        const extraInput = document.getElementById('r-extra');
        const updatePreview = ()=>{
          const item = godaamItems.find(g=>g.id===modalState.draft.godaamId);
          const bagsUsed = parseInt(modalState.draft.bags)||0;
          const extraUsed = parseInt(modalState.draft.extraDozens)||0;
          const preview = item ? (bagsUsed*item.dozensPerBag + extraUsed) : 0;
          const el = document.getElementById('r-preview');
          if(el) el.textContent = t('restock_will_add',{n:preview});
        };
        if(bagsInput){ bagsInput.addEventListener('input', e=>{ modalState.draft.bags = e.target.value; updatePreview(); }); bagsInput.focus(); }
        if(extraInput){ extraInput.addEventListener('input', e=>{ modalState.draft.extraDozens = e.target.value; updatePreview(); }); }
      } else {
        const qtyInput = document.getElementById('r-qty');
        if(qtyInput){ qtyInput.addEventListener('input', e=>{ modalState.draft.qty = e.target.value; }); qtyInput.focus(); }
      }
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalSaveRestock').addEventListener('click', saveRestockModal);
    } else if(modalState.mode==='addLoan'){
      const bind = (id,key)=>{ const el = document.getElementById(id); if(el) el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('l-customer','customerName'); bind('l-amount','amount'); bind('l-note','note');
      const bBtn = document.getElementById('l-type-borrower'); if(bBtn) bBtn.addEventListener('click', ()=>{ modalState.draft.type='borrower'; render(); });
      const gBtn = document.getElementById('l-type-giver'); if(gBtn) gBtn.addEventListener('click', ()=>{ modalState.draft.type='giver'; render(); });
      const afnBtn = document.getElementById('l-currency-afn'); if(afnBtn) afnBtn.addEventListener('click', ()=>{ modalState.draft.currency='AFN'; render(); });
      const usdBtn = document.getElementById('l-currency-usd'); if(usdBtn) usdBtn.addEventListener('click', ()=>{ modalState.draft.currency='USD'; render(); });
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalSaveLoan').addEventListener('click', saveAddLoanModal);
    } else if(modalState.mode==='loanDetail'){
      const bind = (id,key)=>{ const el = document.getElementById(id); if(el) el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('lp-amount','amount'); bind('lp-date','date'); bind('lp-note','note');
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      const savePayBtn = document.getElementById('modalSaveLoanPayment'); if(savePayBtn) savePayBtn.addEventListener('click', saveLoanPayment);
      const delBtn = document.getElementById('modalDeleteLoan'); if(delBtn) delBtn.addEventListener('click', ()=>{
        const loan = loans.find(l=>l.id===modalState.loanId);
        openDeleteReasonModal('loan', modalState.loanId, loan ? loan.customerName : '');
      });
      const printLoanDetailBtn = document.getElementById('printLoanDetailBtn'); if(printLoanDetailBtn) printLoanDetailBtn.addEventListener('click', ()=>tryPrintLoanDetail(modalState.loanId));
      const downloadLoanDetailBtn = document.getElementById('downloadLoanDetailBtn'); if(downloadLoanDetailBtn) downloadLoanDetailBtn.addEventListener('click', ()=>downloadLoanDetail(modalState.loanId));
    } else if(modalState.mode==='addGodaam'){
      const bind = (id,key)=>{ const el = document.getElementById(id); if(el) el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('g-name','name'); bind('g-bags','bagsCount'); bind('g-dpb','dozensPerBag'); bind('g-extra','extraDozens'); bind('g-cost','costPerDozen');
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalSaveGodaam').addEventListener('click', saveAddGodaamModal);
    } else if(modalState.mode==='godaamDetail'){
      const bind = (id,key)=>{ const el = document.getElementById(id); if(el) el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('g-adj-bags','bags'); bind('g-adj-extra','extraDozens'); bind('g-adj-note','note');
      const typeSel = document.getElementById('g-adj-type'); if(typeSel) typeSel.addEventListener('change', e=>{ modalState.draft.type = e.target.value; });
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      const saveAdjBtn = document.getElementById('modalSaveGodaamAdjust'); if(saveAdjBtn) saveAdjBtn.addEventListener('click', saveGodaamAdjustment);
      const delGodaamBtn = document.getElementById('modalDeleteGodaam'); if(delGodaamBtn) delGodaamBtn.addEventListener('click', ()=>{
        const item = godaamItems.find(g=>g.id===modalState.godaamId);
        openDeleteReasonModal('godaam', modalState.godaamId, item ? item.name : '');
      });
    } else if(modalState.mode==='deleteReason'){
      const reasonInput = document.getElementById('del-reason');
      if(reasonInput) reasonInput.addEventListener('input', e=>{ modalState.draft.reason = e.target.value; });
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      const confirmBtn = document.getElementById('modalConfirmDeleteReason');
      if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{ await confirmDeleteWithReason(); });
    } else {
      const bind = (id,key)=>{ const el = document.getElementById(id); el.addEventListener('input', e=>{ modalState.draft[key]=e.target.value; }); };
      bind('s-name','name'); bind('s-role','role'); bind('s-username','username'); bind('s-password','password');
      const adminCheck = document.getElementById('s-admin'); if(adminCheck) adminCheck.addEventListener('change', e=>{ modalState.draft.isAdmin = e.target.checked; });
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalSaveStaff').addEventListener('click', saveStaffModal);
    }
    document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
  }

  if(cameraModal.open){
    const camClose = document.getElementById('cameraCloseBtn'); if(camClose) camClose.addEventListener('click', closeCameraModal);
    const camBg = document.getElementById('cameraModalBg'); if(camBg) camBg.addEventListener('click', e=>{ if(e.target.id==='cameraModalBg') closeCameraModal(); });
    if(!cameraModal.error && !cameraStream) initCameraScan();
  }

  if(confirmState){
    const okBtn = document.getElementById('confirmOkBtn'); if(okBtn) okBtn.addEventListener('click', runConfirm);
    const cancelBtn = document.getElementById('confirmCancelBtn'); if(cancelBtn) cancelBtn.addEventListener('click', closeConfirm);
    const bg = document.getElementById('confirmModalBg'); if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='confirmModalBg') closeConfirm(); });
  }

  if(receiptModal){
    const printBtn = document.getElementById('printReceiptBtn'); if(printBtn) printBtn.addEventListener('click', tryPrintReceipt);
    const downloadBtn = document.getElementById('downloadReceiptBtn'); if(downloadBtn) downloadBtn.addEventListener('click', downloadReceipt);
    const closeBtn = document.getElementById('closeReceiptBtn'); if(closeBtn) closeBtn.addEventListener('click', ()=>{ receiptModal = null; render(); });
    const bg = document.getElementById('receiptModalBg'); if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='receiptModalBg'){ receiptModal = null; render(); } });
  }
}

function resetViewportZoom(){
  const vp = document.querySelector('meta[name=viewport]');
  if(!vp) return;
  const original = 'width=device-width, initial-scale=1.0';
  vp.setAttribute('content', original + ', shrink-to-fit=yes');
  requestAnimationFrame(()=>{ vp.setAttribute('content', original); });
}
window.addEventListener('orientationchange', ()=>{ setTimeout(resetViewportZoom, 50); setTimeout(resetViewportZoom, 300); });
window.addEventListener('resize', ()=>{ if(document.activeElement===document.body) resetViewportZoom(); });

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
